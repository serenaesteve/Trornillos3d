<button class="lamina {{class}}" type="button" data-lamina="{{numero}}" aria-label="{{etiqueta}}" {{bloqueo}}>
  <span class="lamina-numero">{{texto}}</span>
  <img class="lamina-dibujo" src="{{imagen}}" alt="" width="150" height="150" loading="lazy">
  <span class="lamina-nombre">{{nombre}}</span>
  <span class="lamina-estrellas"></span>
</button>
