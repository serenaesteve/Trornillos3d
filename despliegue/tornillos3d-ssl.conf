# Despiece es una web estática: el progreso de cada jugador se queda en su navegador,
# nunca llega a este servidor.
<Directory /var/www/tornillos3d>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<VirtualHost *:443>
    ServerName tornillos3d.serenaesteve.com
    DocumentRoot /var/www/tornillos3d
    DirectoryIndex index.html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tornillos3d.serenaesteve.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tornillos3d.serenaesteve.com/privkey.pem

    AddType application/manifest+json .webmanifest
    AddDefaultCharset UTF-8

    # La app comprueba siempre si hay versión nueva; los dibujos y las fuentes pueden guardarse una semana
    Header set Cache-Control "no-cache"
    <FilesMatch "\.(png|woff2)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>

    Header set X-Content-Type-Options "nosniff"
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    # La inclinación del móvil solo para esta web
    Header set Permissions-Policy "accelerometer=(self), gyroscope=(self), magnetometer=(self), camera=(), microphone=()"
    # 'unsafe-eval' lo necesita el framework: ejecuta cada controlador con new Function, como en clase
    Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml

    ErrorLog ${APACHE_LOG_DIR}/tornillos3d-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/tornillos3d-ssl-access.log combined
</VirtualHost>
