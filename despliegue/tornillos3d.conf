# Despiece en tornillos3d.serenaesteve.com: en el puerto 80 solo se verifica el certificado y se redirige a HTTPS.
<VirtualHost *:80>
    ServerName tornillos3d.serenaesteve.com

    # La verificación de Let's Encrypt se sirve aquí; todo lo demás va a HTTPS.
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://tornillos3d.serenaesteve.com%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/tornillos3d-error.log
    CustomLog ${APACHE_LOG_DIR}/tornillos3d-access.log combined
</VirtualHost>
