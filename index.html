  <style>
    #arranque { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 14px; background: linear-gradient(180deg, #6cc6f4, #9bdcf8 48%, #d3f1fc); color: #1d4468; font: 800 16px/1.3 system-ui, sans-serif; }
    #arranque strong { font-size: 44px; color: #fff; text-shadow: 0 3px 0 #1f62c4; letter-spacing: .01em; }
    #arranque i { width: 44px; height: 44px; border-radius: 50%; background: #46c837; box-shadow: inset 0 -5px 0 #2c9a26; position: relative; animation: arranque 1s linear infinite; }
    #arranque i::before, #arranque i::after { content: ""; position: absolute; inset: 18px 8px; background: #1f6a1a; border-radius: 2px; }
    #arranque i::after { inset: 8px 18px; }
    @keyframes arranque { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #arranque i { animation: none; } }
  </style>
