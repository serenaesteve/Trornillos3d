<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bdcf8}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head>
<body>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js";
window.__toques = 0;
const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camara.position.set(0, 2, 8);
camara.lookAt(0, 0, 0);
const dibujo = new THREE.WebGLRenderer({ antialias: true, alpha: true });
dibujo.setSize(innerWidth, innerHeight);
document.body.append(dibujo.domElement);
escena.add(new THREE.HemisphereLight(0xffffff, 0x888888, 2));
const material = new THREE.MeshStandardMaterial({ color: "#f0373d" });
const bloque = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), material);
escena.add(bloque);
const rayo = new THREE.Raycaster();
dibujo.domElement.addEventListener("pointerup", e => {
  rayo.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: -e.clientY / innerHeight * 2 + 1 }, camara);
  if (!rayo.intersectObject(bloque).length) return;
  material.color.set(window.__toques++ % 2 ? "#f0373d" : "#2c6df2");
});
addEventListener("resize", () => {
  camara.aspect = innerWidth / innerHeight;
  camara.updateProjectionMatrix();
  dibujo.setSize(innerWidth, innerHeight);
});
let antes = performance.now();
dibujo.setAnimationLoop(ahora => {
  bloque.rotation.y += (ahora - antes) / 1000;
  antes = ahora;
  dibujo.render(escena, camara);
  window.__listo ??= performance.now();
});
</script>
</body>
</html>
